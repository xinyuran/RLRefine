schema_version: structalign-bp2-pipeline-v1

pipeline:
  id: bp2_dpo_reliability_v1
  dataset_version: keyword-v2.0.0
  target_contract_version: keyword-json-target-v2
  policy: dpo_reliability_repair_after_two_level_gate

model:
  base_path: models/Qwen2.5-7B-Instruct/a09a35458c702b33eeacc393d103063234e8bc28
  snapshot_revision: a09a35458c702b33eeacc393d103063234e8bc28

data:
  bp1_manifest:
    path: data/canonical/keyword_v2/manifest.json
    sha256: d3605c7a4ca2c3294d6022ce85e9511330f5bf581e63714fc1472f69c5d27c4b
  train:
    path: data/canonical/keyword_v2/train.jsonl
    rows: 2360
    sha256: 6e31a66f715f4faea6d4a2d42042219977c09febd5900f70090cf5a9bb9a98e9
  dev:
    path: data/canonical/keyword_v2/dev.jsonl
    rows: 331
    sha256: a73d294a92681c7fb1cea2c06f6cf09d376fe29b308eae1847f8d01b20079d4c
  challenge:
    path: data/canonical/keyword_v2/challenge.jsonl
    rows: 140
    sha256: a64d18b8bdcc55602c0572323dde1574a7f5e66c4c5dca4e69472f3e057b3510
  forbidden_gold:
    path: data/canonical/keyword_v1/gold/v1/gold_test.jsonl
    sha256: 0df4d88e8bc09d62f867ef8a4b43fe631ed9e357b79b55e022948f9b75e06bf6

runtime:
  ENV:
    CUDA_VISIBLE_DEVICES: "7"
    NPROC_PER_NODE: "1"
  seed: 42
  torch_dtype: bfloat16
  report_to: none

evaluation:
  selection_split: teacher_dev
  diagnostic_split: challenge
  forbidden_selection_split: frozen_human_gold
  metrics:
    - micro_f1
    - macro_f1
    - schema_valid_rate
    - hallucination_keyword_rate
    - mean_input_tokens
    - mean_output_tokens
    - peak_memory_gib
    - train_runtime_seconds

stages:
  sft:
    entrypoint: sft
    model_source: base
    dataset: data/canonical/keyword_v2/train.jsonl
    val_dataset: data/canonical/keyword_v2/dev.jsonl
    output_dir: reports/training/bp2_sft_v2
    authorization_file: reports/authorizations/bp2_sft.json
    dependencies: []
    args:
      train_type: lora
      num_train_epochs: 5
      per_device_train_batch_size: 4
      per_device_eval_batch_size: 4
      gradient_accumulation_steps: 8
      learning_rate: 1.0e-5
      lora_rank: 16
      lora_alpha: 64
      target_modules: all-linear
      max_length: 4096
      truncation_strategy: delete
      gradient_checkpointing: true
      warmup_ratio: 0.05
      save_strategy: steps
      save_steps: 100
      eval_strategy: steps
      eval_steps: 100
      logging_steps: 20
      metric_for_best_model: eval_loss
      greater_is_better: false
      load_best_model_at_end: true
      save_total_limit: 3
      split_dataset_ratio: 0.0
      dataloader_num_workers: 8

  dpo:
    entrypoint: rlhf
    rlhf_type: dpo
    model_source: base_with_sft_adapters
    dataset: data/derived/keyword_v2/dpo_train.jsonl
    val_dataset: data/derived/keyword_v2/dpo_dev.jsonl
    output_dir: reports/training/bp2_dpo_reliability_v1
    authorization_file: reports/authorizations/bp2_dpo_reliability.json
    dependencies:
      - reports/bp3_keyword_v2/preference_gate.json
      - reports/model_gates/bp2_sft_two_level_amendment.json
    args:
      train_type: lora
      num_train_epochs: 1
      per_device_train_batch_size: 1
      per_device_eval_batch_size: 1
      gradient_accumulation_steps: 32
      learning_rate: 5.0e-7
      lora_rank: 16
      lora_alpha: 64
      target_modules: all-linear
      gradient_checkpointing: false
      use_logits_to_keep: true
      max_length: 4096
      truncation_strategy: delete
      beta: 0.2
      save_strategy: steps
      save_steps: 50
      eval_strategy: steps
      eval_steps: 50
      logging_steps: 20
      metric_for_best_model: eval_loss
      greater_is_better: false
      load_best_model_at_end: true
      save_total_limit: 3
      split_dataset_ratio: 0.0
      report_to: none

  grpo:
    entrypoint: rlhf
    rlhf_type: grpo
    model_source: accepted_upstream_checkpoint
    dataset: data/derived/keyword_v2/grpo_train.jsonl
    val_dataset: data/derived/keyword_v2/grpo_dev.jsonl
    output_dir: reports/training/bp2_grpo_v1
    authorization_file: reports/authorizations/bp2_grpo.json
    dependencies:
      - reports/bp3_keyword_v2/reward_v2_gate.json
      - reports/model_gates/bp2_upstream_acceptance.json
    args:
      train_type: lora
      num_train_epochs: 1
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 16
      learning_rate: 5.0e-7
      lora_rank: 8
      lora_alpha: 16
      max_length: 4096
      max_completion_length: 768
      beta: 0.01
      num_generations: 4
      temperature: 0.7
      external_plugins: rl/reward_builder_v2.py
      reward_funcs: schema_based_reward_v2
      use_vllm: false
      save_strategy: steps
      save_steps: 50
      logging_steps: 20
      split_dataset_ratio: 0.0
      report_to: none

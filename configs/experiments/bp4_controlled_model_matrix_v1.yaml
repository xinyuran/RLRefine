schema_version: structalign-bp4-controlled-matrix-v1
work_package: BP4_CONTROLLED_MODEL_MATRIX
policy: base_first_stage_specific_authorization_no_automatic_training

pipeline:
  config: configs/experiments/bp2_post_training_pipeline_v1.yaml
  bp2_gate:
    path: reports/bp2_post_training_pipeline/bp2_gate.json
    sha256: 6e40c14c175ab974527928c57e533461c82e9df44aaa1f0dcd1f75a5f7029ece
  bp3_gate:
    path: reports/bp3_keyword_v2/bp3_gate.json
    sha256: c41202948b9c84794e916a103eb22e4094c0335df60808cfbd57282016a30d24
  preference_gate:
    path: reports/bp3_keyword_v2/preference_gate.json
    sha256: 3ef68161c63610967701207629358713bb5250003bdf8a15f1e911f6f62fc16a
  reward_gate:
    path: reports/bp3_keyword_v2/reward_v2_gate.json
    sha256: 95e7fc1ace93bbf7f23008e24635b0b44da807e6d9fe20bce284b2d6fd556924

evaluation:
  target_contract_version: keyword-json-target-v2
  selection:
    split: teacher_dev
    path: data/canonical/keyword_v2/dev.jsonl
    rows: 331
    sha256: a73d294a92681c7fb1cea2c06f6cf09d376fe29b308eae1847f8d01b20079d4c
  diagnostic:
    split: challenge
    path: data/canonical/keyword_v2/challenge.jsonl
    rows: 140
    sha256: a64d18b8bdcc55602c0572323dde1574a7f5e66c4c5dca4e69472f3e057b3510
  forbidden_selection: frozen_human_gold
  decoding:
    do_sample: false
    temperature: 0.0
    max_new_tokens: 768
    seed: 42
  bootstrap_iterations: 10000

acceptance:
  paired_macro_f1_delta_min: 0.02
  paired_macro_f1_ci_low_gt: 0.0
  micro_f1_delta_min: 0.0
  schema_valid_rate_min: 0.90
  schema_valid_rate_delta_min: 0.0
  hallucination_keyword_rate_max: 0.03
  hallucination_keyword_rate_delta_max: 0.0
  mean_output_tokens_ratio_max: 1.0
  max_token_output_count_delta_max: 0
  require_complete_dev_coverage: true
  challenge_is_diagnostic_only: true

matrix:
  - id: B1_V2
    stage: base
    parent: null
    execution: inference_only
    next_if_accept: E1_SFT
  - id: E1_SFT
    stage: sft
    parent: B1_V2
    execution: requires_stage_authorization
    next_if_accept: [E2_DPO, E3_GRPO_FROM_SFT]
  - id: E2_DPO
    stage: dpo
    parent: E1_SFT
    execution: requires_sft_acceptance_and_stage_authorization
    next_if_accept: E4_GRPO_FROM_DPO
  - id: E3_GRPO_FROM_SFT
    stage: grpo
    parent: E1_SFT
    execution: requires_sft_upstream_acceptance_and_stage_authorization
    next_if_accept: null
  - id: E4_GRPO_FROM_DPO
    stage: grpo
    parent: E2_DPO
    execution: requires_dpo_upstream_acceptance_and_stage_authorization
    next_if_accept: null

outputs:
  report_dir: reports/bp4_controlled_matrix
  matrix_plan: reports/bp4_controlled_matrix/matrix_plan.json
  base_task: reports/bp4_controlled_matrix/base_v2_evaluation_task.json
  sft_authorization_candidate: reports/bp4_controlled_matrix/authorization_candidates/bp2_sft.json
  manifest: reports/bp4_controlled_matrix/bp4_manifest.json
  gate: reports/bp4_controlled_matrix/bp4_gate.json
  feedback: reports/bp4_controlled_matrix/bp4_feedback.json
